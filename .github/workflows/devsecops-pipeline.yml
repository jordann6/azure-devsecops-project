name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: python-app

permissions:
  id-token: write
  contents: read

jobs:
  # ── Stage 1: Shift-left security scans ────────────────────────────────────
  sast:
    name: SAST & IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bandit — Python SAST
        run: |
          pip install bandit
          bandit -r ./src -ll -f json -o bandit-report.json || true
          bandit -r ./src -ll

      - name: pip-audit — Dependency CVE scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Checkov — Terraform IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          soft_fail: true
          quiet: true

      - name: Checkov — Kubernetes manifest scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: manifests/
          framework: kubernetes
          soft_fail: true
          quiet: true

  # ── Stage 2: Build → container scan → push ────────────────────────────────
  build-and-scan:
    name: Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: sast
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      acr_login_server: ${{ steps.acr.outputs.login_server }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr
        run: |
          SERVER=$(az acr show --name ${{ vars.ACR_NAME }} --query loginServer -o tsv)
          echo "login_server=$SERVER" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (linux/amd64)
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            -t ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Trivy — container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image to ACR
        if: github.ref == 'refs/heads/main'
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          docker push ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          docker push ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest

  # ── Stage 3: DAST against a locally-running container ─────────────────────
  dast:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pull and run app container
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          docker run -d \
            --name target-app \
            -p 5000:5000 \
            -e APP_ENV=staging \
            -e SECRET_KEY=zap-scan-key \
            ${{ needs.build-and-scan.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-scan.outputs.image_tag }}
          # Wait for app to be healthy
          for i in {1..15}; do
            curl -sf http://localhost:5000/health && break || sleep 2
          done

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          rules_file_name: ".zap-rules.tsv"
          fail_action: false
          allow_issue_writing: false

      - name: Stop container
        if: always()
        run: docker stop target-app || true

  # ── Stage 4: Blue/Green deploy to AKS ────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: dast
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Deploy blue slot
        env:
          ACR_LOGIN_SERVER: ${{ needs.build-and-scan.outputs.acr_login_server }}
          IMAGE_TAG: ${{ needs.build-and-scan.outputs.image_tag }}
        run: |
          # Substitute ACR server and tag into manifests
          export ACR_LOGIN_SERVER IMAGE_TAG IMAGE_NAME=${{ env.IMAGE_NAME }}
          envsubst < manifests/blue-deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/python-app-blue --timeout=120s

      - name: Switch service traffic to blue
        run: |
          kubectl patch service python-app-service \
            -p '{"spec":{"selector":{"app":"python-app","version":"blue"}}}'

      - name: Verify deployment
        run: |
          kubectl get pods -l app=python-app
          kubectl get service python-app-service
